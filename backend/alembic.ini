# A generic, single database configuration.

[alembic]

# Path to the migration scripts.
# This is relative to the location of this ini file.
script_location = %(here)s/alembic

# Revision files will use this path separator.
path_separator = os

# Add the current directory to Python's import path.
prepend_sys_path = .

# We load the actual database URL from backend/.env
# through alembic/env.py.
sqlalchemy.url = postgresql+psycopg://postgres:placeholder@localhost:5433/3d_bharat


[post_write_hooks]


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S